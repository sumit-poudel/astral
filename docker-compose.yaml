networks:
  public:
    driver: bridge

services:
  astral:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8090:8090"
    networks:
      - public
    depends_on:
      migration:
        condition: service_completed_successfully

  migration:
    build: .
    command: goose up
    env_file:
      - .env
